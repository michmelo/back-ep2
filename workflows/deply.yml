name: CI/CD Backend — Build, Push y Deploy en EC2

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    steps:

      # PASO 1: Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # PASO 2: Login en Docker Hub
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # PASO 3: Configurar Docker Buildx (para builds eficientes)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASO 4: Build y Push de la imagen
      - name: Build y Push imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/back-ep2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/back-ep2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PASO 5: Deploy en EC2 via SSH
      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ir al directorio del proyecto
            cd /home/${{ secrets.EC2_USER }}/Back_EVAL2
            
            # Actualizar el código
            git pull origin deploy
            
            # Login en Docker Hub desde la EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Descargar la imagen más reciente
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-ep2:latest
            
            # Crear archivo .env en la EC2 con los secrets
            cat > .env << EOF
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            
            # Reiniciar los servicios con la nueva imagen
            docker compose down
            docker compose up -d
            
            # Verificar que los contenedores están corriendo
            docker compose ps
            
            echo "✅ Deploy completado exitosamente"